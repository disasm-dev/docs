openapi: 3.1.0
info:
  title: Cloudflare
  version: 1.0.0
  description: |
    Solves Cloudflare's challenge pages (managed, non-interactive and interactive challenges, and Under Attack mode) and
    Turnstile widgets on a site's own page. You make every request yourself, from your own session and proxy: we give you
    each request to send, exactly as Chrome would send it, and you hand back what came back.

    A solve is billed once, when its first `/solves/{id}/next` call succeeds. Starting a solve is free, and so is a solve whose first step fails. See the
    [Cloudflare guide](/cloudflare/overview/).
servers:
  - url: https://cf.antibotapi.com
    description: Production
security:
  - ApiKey: []
tags:
  - name: cloudflare
paths:
  /solves:
    post:
      tags: [cloudflare]
      operationId: startSolve
      summary: Start a solve
      description: |
        Send the address you asked for, the page Cloudflare answered with (the `403` challenge page, or a site's page holding
        a Turnstile widget), and your client's User-Agent. Returns the solve's id and the first request to send.
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
            example:
              url: https://www.example.com/
              html: <!DOCTYPE html><html lang="en-US"><head><title>Just a moment...</title>...
              user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36
      responses:
        '200':
          description: The solve's id and the first request to send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
              example:
                id: 6f1c2a8e-4b1e-4a37-9c0e-2b9f0f6f3a11
                request:
                  method: GET
                  url: https://www.example.com/cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1?ray=a4e9cb6aae35e6ac
                  headers:
                    - ['sec-ch-ua-full-version-list', '"Google Chrome";v="155.0.8059.85", "Chromium";v="155.0.8059.85", "Not(A:Brand";v="24.0.0.0"']
                    - ['sec-ch-ua-platform', '"Windows"']
                    - ['sec-ch-ua', '"Google Chrome";v="155", "Chromium";v="155", "Not(A:Brand";v="24"']
                    - ['user-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36']
                    - ['accept', '*/*']
                    - ['sec-fetch-site', 'same-origin']
                    - ['sec-fetch-mode', 'no-cors']
                    - ['sec-fetch-dest', 'script']
                    - ['referer', 'https://www.example.com/?__cf_chl_rt_tk=...']
                    - ['accept-encoding', 'gzip, deflate, br, zstd']
                    - ['accept-language', 'en-GB,en-US;q=0.9,en;q=0.8']
                    - ['cookie', '']
                  wait_ms: 0
                  timeout_ms: 0
        '400':
          description: |
            The body is not the JSON this endpoint takes, or no browser we solve as sends your `user_agent` (the body then
            lists the ones we do under `user_agents`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownUserAgent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unsolvable'
        '503':
          $ref: '#/components/responses/Busy'
  /solves/{id}/next:
    post:
      tags: [cloudflare]
      operationId: nextRequest
      summary: Get the next request
      description: |
        Send what came back from the request you were given last, whatever it was. Returns the next request, or `done` once
        the solve is finished. For a challenge page with `cleared` (its `cf_clearance` cookie is then in your jar), for a widget
        with its `token`.

        A request you gave up on after its `timeout_ms` goes back as status `0`. A solve not done within a minute is dropped.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reply'
            example:
              status: 200
              headers:
                content-type: application/javascript; charset=UTF-8
              body: <base64 of the response body>
      responses:
        '200':
          description: The next request, or the end of the solve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextResponse'
              examples:
                next:
                  summary: The next request
                  value:
                    request:
                      method: POST
                      url: https://www.example.com/cdn-cgi/challenge-platform/h/b/fo/...
                      headers:
                        - ['content-length', '2327']
                        - ['...', '...']
                        - ['cf-chl', 'g2bs0gK8vVK4W1vYHMqhaVc9BcPIYvmfveFnhsEsvRc-...']
                        - ['cookie', '']
                        - ['priority', 'u=1, i']
                      body: v_a4e9cb6aae35e6ac=...
                      wait_ms: 128
                      timeout_ms: 5000
                cleared:
                  summary: A challenge page, cleared
                  value:
                    done: true
                    cleared: true
                widget:
                  summary: A widget's token
                  value:
                    done: true
                    token: 0.Ab3dEf...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such solve for your key (it ended, expired, or was started by another key).
        '422':
          $ref: '#/components/responses/Unsolvable'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    Signature:
      name: x-signature
      in: header
      required: false
      description: Required when request signing is on for your key. See [Authentication](/start/authentication/).
      schema:
        type: string
  responses:
    BadRequest:
      description: The body is not the JSON this endpoint takes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No key, an unknown key, a key out of balance, or a key not on the beta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unsolvable:
      description: |
        We could not take the next step: a response that was not what it should be (a `403` where a `200` was due), or a page
        or script we cannot read. The solve ends; start a new one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            error: Expected the PageScript request to answer 200, it answered 403
    Busy:
      description: Too many solves in progress. Retry shortly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    StartRequest:
      type: object
      required: [url, html, user_agent]
      properties:
        url:
          type: string
          format: uri
          description: The address you asked for, as you asked for it (query and fragment included).
        html:
          type: string
          description: The page's body as it came.
        user_agent:
          type: string
          description: |
            The User-Agent your client sends, exactly. You must ensure that you are keeping the user-agent consistent
            and using a matching TLS profile. Any mismatching user-agent or TLS will cause blocks
    StartResponse:
      type: object
      required: [id, request]
      properties:
        id:
          type: string
          format: uuid
        request:
          $ref: '#/components/schemas/Request'
    NextResponse:
      type: object
      description: Either `request`, or `done` with `cleared` (a challenge page) or `token` (a widget).
      properties:
        request:
          $ref: '#/components/schemas/Request'
        done:
          type: boolean
          const: true
        cleared:
          type: boolean
          description: Whether the challenge page's form let you in. When true, `cf_clearance` is in your cookie jar.
        token:
          type: string
          description: The widget's token. Post it as the page's form would.
    Request:
      type: object
      required: [method, url, headers, wait_ms, timeout_ms]
      description: A request to send exactly as given.
      properties:
        method:
          type: string
          enum: [GET, POST]
        url:
          type: string
          format: uri
        headers:
          type: array
          description: |
            Every header, as `[name, value]`, in the order to send them. Send them as they stand and add none. Fill the
            `cookie` one, left empty, from your cookie jar for the address (leave it out if you have none for it). Your HTTP
            library may set `content-length` itself; it is given so you can keep its place.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        body:
          type: string
          description: The body to send, for a POST.
        wait_ms:
          type: integer
          description: |
            Hold the request this many ms before sending it. Cloudflare refuses an answer that arrives sooner than the work it
            claims could have taken.
        timeout_ms:
          type: integer
          description: Give up after this many ms (0 for no limit) and hand back status 0.
        delete_cookies:
          type: array
          items:
            type: string
          description: Cookies to delete from your jar for the site before sending this request (the challenge page's own script does).
    Reply:
      type: object
      required: [status, headers, body]
      properties:
        status:
          type: integer
          description: The response's status, or 0 for a request you gave up on.
        headers:
          type: object
          additionalProperties:
            type: string
          description: The response's headers, as they came (names in any case; join repeated ones).
        body:
          type: string
          contentEncoding: base64
          description: The response body as it came, Base64.
    UnknownUserAgent:
      type: object
      required: [error]
      properties:
        error:
          type: string
        user_agents:
          type: array
          items:
            type: string
          description: The User-Agents we solve as, when yours is not one of them.
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string
              description: What went wrong.
